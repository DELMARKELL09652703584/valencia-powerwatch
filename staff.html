<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Valencia PowerWatch · Field Staff</title>
    <meta name="description" content="Valencia PowerWatch field response app for authorized staff." />
    <meta name="theme-color" content="#0b2944" />
    <meta name="application-name" content="PowerWatch Field" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/staff-manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/powerwatch-field-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/powerwatch-field-icon-180.png" />
    <link rel="stylesheet" href="/app/staff.css?v=11" />
  </head>
  <body class="staff-app">
    <div id="staff-app">
      <main class="staff-loading" aria-live="polite">
        <img src="/assets/powerwatch-logo.svg" alt="" width="56" height="56" />
        <strong>PowerWatch Field</strong>
        <span>Loading secure staff workspace…</span>
      </main>
    </div>
    <div id="staff-toast" class="staff-toast" role="status" aria-live="polite" hidden></div>
    <section id="staff-update-notice" class="staff-update-notice" role="status" aria-live="polite" aria-label="Staff App update available" hidden>
      <div class="staff-update-copy">
        <strong>Staff App update ready</strong>
        <span>A newer version is available. Update to use the latest features and fixes.</span>
      </div>
      <div class="staff-update-actions">
        <button type="button" class="staff-btn staff-btn-primary" data-staff-update="apply">Update now</button>
        <button type="button" class="staff-btn staff-btn-quiet" data-staff-update="later">Later</button>
      </div>
    </section>
    <script src="/app/staff.js?v=15"></script>
    <script src="/app/staff-pwa-update.js?v=1"></script>
  </body>
</html>
