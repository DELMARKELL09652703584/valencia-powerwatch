services:
  - type: web
    name: valencia-powerwatch
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && node --test
    startCommand: node server/start.js
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.12.0
      - key: POWERWATCH_SNAPSHOT_ENABLED
        value: "true"
      - key: PERSISTENT_AUTH_REQUIRED
        value: "true"
      - key: DATABASE_URL
        sync: false
