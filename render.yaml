services:
  - type: web
    name: valencia-powerwatch-persistent
    runtime: node
    plan: free
    branch: valencia-neon-staging
    buildCommand: npm ci && node --test
    startCommand: node server/index.js
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.12.0
      - key: PERSISTENT_AUTH_REQUIRED
        value: "true"
      - key: NEON_DATABASE_URL
        sync: false
