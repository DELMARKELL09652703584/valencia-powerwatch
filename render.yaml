services:
  - type: web
    name: valencia-powerwatch
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: node server/index.js
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.12.0
