<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google</title>
  <link rel="icon" href="/assets/powerwatch-logo.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .oauth-window {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border: 1px solid #dadce0;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      position: relative;
    }

    /* Progress Bar */
    .oauth-progress-bar {
      height: 4px;
      width: 100%;
      background: #e0e0e0;
      overflow: hidden;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }
    .oauth-progress-bar.active { display: block; }
    .oauth-progress-inner {
      width: 100%;
      height: 100%;
      background: #1a73e8;
      animation: googleIndeterminate 1.4s infinite cubic-bezier(0.65, 0.815, 0.735, 0.395);
      transform-origin: 0% 50%;
    }
    @keyframes googleIndeterminate {
      0% { transform: translateX(-100%) scaleX(0.2); }
      50% { transform: translateX(0%) scaleX(0.5); }
      100% { transform: translateX(100%) scaleX(0.2); }
    }

    .oauth-content { padding: 32px 28px 24px; }
    .oauth-logo-row { display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .oauth-title { font-size: 1.35rem; font-weight: 500; text-align: center; color: #202124; margin-bottom: 6px; }
    .oauth-subtitle { font-size: 0.92rem; text-align: center; color: #5f6368; margin-bottom: 24px; }
    .oauth-subtitle b { color: #202124; font-weight: 600; }

    .oauth-alert {
      background: #fdf2f2;
      border: 1px solid #f87171;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 16px;
      display: none;
    }

    /* Saved Account List */
    .saved-account-section {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }
    .accounts-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #e8eaed;
      border-bottom: 1px solid #e8eaed;
    }
    .account-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
      font-family: inherit;
    }
    .account-card:hover { background: #f8f9fa; }
    .account-card:disabled { opacity: 0.6; cursor: not-allowed; }
    .account-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #4285f4;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 0.95rem;
      flex-shrink: 0;
    }
    .account-info { flex: 1; min-width: 0; }
    .account-name { font-size: 0.9rem; font-weight: 600; color: #3c4043; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-email { font-size: 0.78rem; color: #5f6368; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Another Account Section */
    .custom-account-toggle {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      color: #1a73e8;
      font-weight: 600;
      font-size: 0.88rem;
    }
    .custom-account-toggle:hover { background: #f8f9fa; }
    .custom-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px dashed #dadce0;
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      color: #5f6368;
      flex-shrink: 0;
    }

    .custom-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-size: 0.8rem; font-weight: 600; color: #4b5563; }
    .form-field input {
      padding: 11px 13px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-field input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }

    .submit-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }
    .btn {
      padding: 10px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: background 0.15s ease;
    }
    .btn-ghost { background: transparent; color: #5f6368; }
    .btn-ghost:hover { background: #f1f3f4; color: #202124; }
    .btn-primary { background: #1a73e8; color: #ffffff; }
    .btn-primary:hover { background: #1557b0; }

    /* Footer */
    .oauth-footer {
      padding: 16px 28px;
      background: #f8f9fa;
      border-top: 1px solid #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: #70757a;
    }
    .footer-links { display: flex; gap: 14px; }
    .footer-links a { color: #70757a; text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }

    /* Facebook Mode Styles */
    body.facebook-mode { background: #f0f2f5; }
    .facebook-mode .oauth-window { border-color: #e4e6eb; border-radius: 10px; }
    .facebook-mode .oauth-title { color: #1877f2; font-weight: 700; }
    .facebook-mode .account-avatar { background: #1877f2; }
    .facebook-mode .btn-primary { background: #1877f2; }
    .facebook-mode .btn-primary:hover { background: #166fe5; }
    .facebook-mode .custom-account-toggle { color: #1877f2; }
    .facebook-mode .oauth-progress-inner { background: #1877f2; }
    .facebook-mode .form-field input:focus { border-color: #1877f2; box-shadow: 0 0 0 2px rgba(24,119,242,0.2); }
  </style>
</head>
<body>

  <div class="oauth-window">
    <div class="oauth-progress-bar" id="progressBar"><div class="oauth-progress-inner"></div></div>

    <div class="oauth-content">
      <div class="oauth-logo-row" id="logoRow"></div>
      <h1 class="oauth-title" id="pageTitle">Sign in with Google</h1>
      <p class="oauth-subtitle" id="pageSubtitle">to continue to <b>Valencia PowerWatch</b></p>

      <div class="oauth-alert" id="alertBox"></div>

      <!-- Saved Account Section (If authenticated on this browser previously) -->
      <div class="saved-account-section" id="savedAccountSection" style="display: none;">
        <div class="accounts-list">
          <button type="button" class="account-card" id="savedAccountBtn">
            <div class="account-avatar" id="savedAccountAvatar">U</div>
            <div class="account-info">
              <span class="account-name" id="savedAccountName">User</span>
              <span class="account-email" id="savedAccountEmail">user@example.com</span>
            </div>
          </button>
        </div>
        <button type="button" class="custom-account-toggle" id="toggleCustomBtn">
          <div class="custom-icon">👤</div>
          <span id="toggleText">Use another account</span>
        </button>
      </div>

      <!-- Main Sign-In Form -->
      <form class="custom-form" id="customForm">
        <div class="form-field">
          <label id="nameLabel">Full Name</label>
          <input type="text" id="customName" placeholder="e.g. Maria Santos" required autocomplete="name">
        </div>
        <div class="form-field">
          <label id="emailLabel">Google Email Address</label>
          <input type="email" id="customEmail" placeholder="youraccount@gmail.com" required autocomplete="email">
        </div>
        <div class="submit-row">
          <button type="button" class="btn btn-ghost" id="cancelCustomBtn" onclick="window.close()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitCustomBtn">Sign In</button>
        </div>
      </form>
    </div>

    <div class="oauth-footer">
      <span>Valencia PowerWatch Auth</span>
      <div class="footer-links">
        <a href="javascript:void(0)" onclick="window.close()">Cancel</a>
        <a href="javascript:void(0)">Privacy</a>
        <a href="javascript:void(0)">Terms</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const provider = params.get('provider') === 'facebook' ? 'facebook' : 'google';
    const isGoogle = provider === 'google';

    const progressBar = document.getElementById('progressBar');
    const alertBox = document.getElementById('alertBox');
    const logoRow = document.getElementById('logoRow');
    const pageTitle = document.getElementById('pageTitle');
    const pageSubtitle = document.getElementById('pageSubtitle');
    const savedAccountSection = document.getElementById('savedAccountSection');
    const savedAccountBtn = document.getElementById('savedAccountBtn');
    const savedAccountAvatar = document.getElementById('savedAccountAvatar');
    const savedAccountName = document.getElementById('savedAccountName');
    const savedAccountEmail = document.getElementById('savedAccountEmail');
    const toggleCustomBtn = document.getElementById('toggleCustomBtn');
    const toggleText = document.getElementById('toggleText');
    const customForm = document.getElementById('customForm');
    const nameLabel = document.getElementById('nameLabel');
    const emailLabel = document.getElementById('emailLabel');
    const customName = document.getElementById('customName');
    const customEmail = document.getElementById('customEmail');
    const submitCustomBtn = document.getElementById('submitCustomBtn');

    if (isGoogle) {
      document.title = 'Sign in - Google Accounts';
      logoRow.innerHTML = `
        <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      `;
      pageTitle.textContent = 'Sign in with Google';
      pageSubtitle.innerHTML = 'Enter your Google account to continue to <b>Valencia PowerWatch</b>';
      emailLabel.textContent = 'Google Email Address';
      customEmail.placeholder = 'youraccount@gmail.com';
      toggleText.textContent = 'Use another Google account';
      submitCustomBtn.textContent = 'Sign In';
    } else {
      document.body.classList.add('facebook-mode');
      document.title = 'Log in with Facebook | Meta';
      logoRow.innerHTML = `
        <svg viewBox="0 0 24 24" width="38" height="38" fill="#1877F2" aria-hidden="true">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      `;
      pageTitle.textContent = 'Log in with Facebook';
      pageSubtitle.innerHTML = 'Enter your Facebook account to connect with <b>Valencia PowerWatch</b>';
      emailLabel.textContent = 'Facebook Email Address';
      customEmail.placeholder = 'youraccount@facebook.com';
      toggleText.textContent = 'Log into another Facebook account';
      submitCustomBtn.textContent = 'Log In';
    }

    // Check for saved account on this device
    let savedAccount = null;
    try {
      const stored = localStorage.getItem(`powerwatch_saved_${provider}_user`);
      if (stored) {
        savedAccount = JSON.parse(stored);
      }
    } catch (e) {}

    if (savedAccount && savedAccount.email && savedAccount.name) {
      savedAccountSection.style.display = 'block';
      customForm.style.display = 'none';
      savedAccountName.textContent = savedAccount.name;
      savedAccountEmail.textContent = savedAccount.email;
      savedAccountAvatar.textContent = (savedAccount.name.trim().charAt(0) || 'U').toUpperCase();

      savedAccountBtn.addEventListener('click', () => {
        submitAuth(savedAccount.name, savedAccount.email);
      });

      toggleCustomBtn.addEventListener('click', () => {
        savedAccountSection.style.display = 'none';
        customForm.style.display = 'flex';
        customName.focus();
      });
    } else {
      savedAccountSection.style.display = 'none';
      customForm.style.display = 'flex';
      customName.focus();
    }

    async function submitAuth(name, email) {
      alertBox.style.display = 'none';
      progressBar.classList.add('active');
      const allBtns = document.querySelectorAll('button, input');
      allBtns.forEach(b => b.disabled = true);

      try {
        const res = await fetch('/api/auth/oauth/social-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider, name, email })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed.');
        }

        // Save account on this device for seamless 1-click continuation next time
        try {
          localStorage.setItem(`powerwatch_saved_${provider}_user`, JSON.stringify({
            name: data.user.full_name || name,
            email: data.user.email || email,
          }));
        } catch (e) {}

        const targetDestination = data.destination || (['administrator', 'personnel', 'dispatcher', 'utility'].includes(data.user?.role) ? '/admin' : '/community');

        // Notify parent window (opener)
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'OAUTH_AUTH_SUCCESS',
            user: data.user,
            destination: targetDestination,
            provider,
            message: data.message || `Signed in with ${isGoogle ? 'Google' : 'Facebook'} successfully.`
          }, '*');
          setTimeout(() => window.close(), 300);
        } else {
          // If opened directly without popup
          window.location.assign(targetDestination);
        }
      } catch (err) {
        progressBar.classList.remove('active');
        allBtns.forEach(b => b.disabled = false);
        alertBox.textContent = err.message || 'Authentication error. Please try again.';
        alertBox.style.display = 'block';
      }
    }

    customForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = customName.value.trim();
      const email = customEmail.value.trim();
      if (!email) return;
      submitAuth(name, email);
    });
  </script>
</body>
</html>
