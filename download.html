<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Download & Install · Valencia PowerWatch Mobile App</title>
    <meta name="description" content="Install the Valencia PowerWatch Mobile Application on your phone for fast power outage reporting and updates in Valencia City, Bukidnon." />
    <meta name="theme-color" content="#073c68" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/assets/powerwatch-logo.svg" />
    <link rel="apple-touch-icon" href="/assets/powerwatch-logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      :root {
        --app-blue: #073c68;
        --app-accent: #ffd34e;
        --app-green: #10b981;
        --app-dark: #0b1329;
      }
      body.download-page {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at top, #0d1e3d 0%, #060c18 100%);
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .install-container {
        max-width: 460px;
        width: 100%;
        margin: auto;
        padding: 24px 20px;
        box-sizing: border-box;
      }
      .app-hero-card {
        display: flex;
        gap: 18px;
        align-items: center;
        margin-bottom: 26px;
      }
      .app-icon-wrapper {
        width: 84px;
        height: 84px;
        background: #073c68;
        border-radius: 20px;
        padding: 6px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 211, 78, 0.4);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-icon-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .app-meta h1 {
        margin: 0 0 4px 0;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.3px;
      }
      .app-meta .publisher {
        color: #38bdf8;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .app-meta .tags {
        font-size: 12px;
        color: #94a3b8;
      }
      .btn-install-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 16px 20px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: #ffffff;
        font-size: 17px;
        font-weight: 700;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        text-decoration: none;
        box-sizing: border-box;
      }
      .btn-install-primary:active {
        transform: scale(0.98);
      }
      #installedToast {
        display: none;
        background: #10b981;
        color: white;
        text-align: center;
        padding: 12px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body class="download-page">
    <div class="install-container">
      
      <!-- App Hero Card -->
      <div class="app-hero-card">
        <div class="app-icon-wrapper">
          <img src="/assets/powerwatch-logo.svg" alt="Valencia PowerWatch Logo" />
        </div>
        <div class="app-meta">
          <h1>Valencia PowerWatch</h1>
          <div class="publisher">
            <span>City Government of Valencia</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#38bdf8"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          </div>
          <div class="tags">Utilities · Outage Reporting · Maps</div>
        </div>
      </div>

      <!-- Toast if already installed -->
      <div id="installedToast">
        ✓ Successfully installed on your device! You can now open it from your Home Screen.
      </div>

      <!-- Main Action Buttons -->
      <button id="btnInstall" class="btn-install-primary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
        </svg>
        <span id="btnInstallText">📥 INSTALL ON PHONE NOW</span>
      </button>

    </div>

    <script>
      let deferredPrompt = null;
      const btnInstall = document.getElementById('btnInstall');
      const btnInstallText = document.getElementById('btnInstallText');
      const installedToast = document.getElementById('installedToast');

      // Check if already running in standalone PWA mode
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (isStandalone) {
        // User already launched as installed app -> redirect straight to community portal
        window.location.replace('/community?source=standalone');
      }

      // Listen for browser install prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btnInstallText.innerText = '📥 INSTALL ON PHONE NOW';
        btnInstall.style.boxShadow = '0 0 25px rgba(16, 185, 129, 0.6)';
        btnInstall.style.transform = 'scale(1.02)';
      });

      async function triggerInstall() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            installedToast.style.display = 'block';
            btnInstallText.innerText = '✓ INSTALLED ON PHONE';
            btnInstall.style.background = '#059669';
            setTimeout(() => {
              window.location.href = '/community';
            }, 1200);
          }
          deferredPrompt = null;
        } else {
          // If browser prompt is unavailable, proceed directly to the portal
          window.location.href = '/community';
        }
      }

      btnInstall.addEventListener('click', triggerInstall);
      document.querySelector('.app-hero-card')?.addEventListener('click', triggerInstall);

      window.addEventListener('appinstalled', () => {
        installedToast.style.display = 'block';
        btnInstallText.innerText = '✓ INSTALLED ON PHONE';
        setTimeout(() => {
          window.location.href = '/community';
        }, 1200);
      });

      // Register Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(console.error);
      }
    </script>
  </body>
</html>
