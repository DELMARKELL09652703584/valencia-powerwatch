<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Valencia PowerWatch · Community User App</title>
    <meta name="description" content="Valencia PowerWatch community mobile app for Valencia City, Bukidnon." />
    <meta name="theme-color" content="#073c68" />
    <link rel="stylesheet" href="/style.css?v=15" />
    <script>
      window.POWERWATCH_PORTAL = 'community';
    </script>
  </head>
  <body class="community-body">
    <div id="app"></div>
    <script>
      const v = '2.3_' + Date.now();
      const coreScript = document.createElement('script');
      coreScript.src = '/app/core.js?v=' + v;
      coreScript.onload = () => {
        const portalScript = document.createElement('script');
        portalScript.src = '/app/community.js?v=' + v;
        portalScript.onload = () => {
          const routerScript = document.createElement('script');
          routerScript.src = '/app/main.js?v=' + v;
          document.body.append(routerScript);
        };
        document.body.append(portalScript);
      };
      document.body.append(coreScript);
    </script>
  </body>
</html>
