<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valencia PowerWatch</title>
    <meta name="description" content="Community Power Interruption Reporting, Verification, and Information Management System for Valencia City, Bukidnon." />
    <link rel="stylesheet" href="/style.css?v=2.2" />
    <script>
      window.POWERWATCH_PORTAL = 'auto';
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const v = '2.2_' + Date.now();
      const coreScript = document.createElement('script');
      coreScript.src = '/app/core.js?v=' + v;
      coreScript.onload = () => {
        const portalScript = document.createElement('script');
        portalScript.src = (window.matchMedia('(max-width: 780px)').matches ? '/app/community.js' : '/app/admin.js') + '?v=' + v;
        portalScript.onload = () => {
          const routerScript = document.createElement('script');
          routerScript.src = '/app/main.js?v=' + v;
          document.body.append(routerScript);
        };
        document.body.append(portalScript);
      };
      document.body.append(coreScript);
    </script>
  </body>
</html>
